services:
  node_db_test:
    image: postgres:12
    environment:
      POSTGRES_DB: node_rest_db_test
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: test_password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test_user -d node_rest_db_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  node_app_test:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      PG_DB: node_rest_db_test
      PG_USER: test_user
      PG_PASSWORD: test_password
      PG_HOST: node_db_test
    depends_on:
      node_db_test:
        condition: service_healthy
    command: npm test